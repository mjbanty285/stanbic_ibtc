<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments | Internet Banking</title>
  <style>
    :root {
      --primary: #0056b3;
      --header-blue: #0066cc;
      --bg: #f4f6f9;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .app-header {
      background: linear-gradient(180deg, var(--header-blue), #0052a3);
      color: #fff;
      padding: 16px 16px 20px;
    }
    .select-bar {
      background: #fff;
      margin: 14px 16px 0;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    main { padding: 16px; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      overflow: hidden;
    }
    .search-wrap { padding: 12px; }
    .search-wrap input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 14px;
    }
    .list-item {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: #fff;
      border: none;
      border-top: 1px solid #f1f1f1;
      padding: 14px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 64px; background: var(--header-blue);
      display: flex; align-items: center; justify-content: space-around;
      color: #fff;
    }
    .nav-item { color: #fff; text-decoration: none; font-size: 10px; opacity: .75; }
    .nav-item.active { opacity: 1; font-weight: 700; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1></h1>
    <p>Welcome back!</p>
  </header>

  <div class="select-bar">
    Electricity
    <span>▼ Select a module</span>
  </div>

  <main>
    <div class="card">
      <div class="search-wrap">
        <input type="search" placeholder="search">
      </div>
      <button class="list-item">ABUJA ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">BENIN ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">EKO ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">ENUGU ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">IBADAN ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">IKEJA ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">JOS ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">KADUNA ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">KANO ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
      <button class="list-item">PORT HARCOURT ELECTRICITY DISTRIBUTION COMPANY <span>›</span></button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="airtime.html">Home</a>
    <a class="nav-item" href="airtime.html">Airtime</a>
    <a class="nav-item" href="transfer.html">Transfer</a>
    <a class="nav-item" href="loan.html">Loans</a>
    <a class="nav-item active" href="payments.html">Payments</a>
  </nav>
</body>
</html>
