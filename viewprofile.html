<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanbic IBTC Bank - View Profile</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fa;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Profile Card Container --- */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border-top: 6px solid #0033a0; /* Stanbic Dark Blue */
        }

        /* --- Header Section --- */
        .profile-header {
            background: linear-gradient(135deg, #0033a0 0%, #0072ce 100%); /* Brand Colors */
            padding: 30px 20px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #ffffff;
            border: 3px solid rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: #0033a0;
            font-weight: bold;
        }

        .status-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background-color: #2ec4b6; /* KYC Verified Green */
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            border: 2px solid #0033a0;
            font-weight: bold;
        }

        .profile-header h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .profile-header p {
            font-size: 14px;
            color: #e0e6ed;
            letter-spacing: 0.5px;
        }

        /* --- Body / Details Section --- */
        .profile-body {
            padding: 24px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #777777;
            letter-spacing: 1px;
            margin-bottom: 16px;
            border-bottom: 1px solid #eef2f5;
            padding-bottom: 6px;
        }

        .info-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .info-group:last-of-type {
            margin-bottom: 24px;
        }

        .info-label {
            font-size: 14px;
            color: #666666;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #111111;
            text-align: right;
        }

        /* --- Footer / Actions Section --- */
        .profile-footer {
            padding: 0 24px 24px;
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #0033a0;
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #002266;
        }

        .btn-secondary {
            background-color: transparent;
            color: #0033a0;
            border: 1px solid #0033a0;
        }

        .btn-secondary:hover {
            background-color: #f0f4fa;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Header -->
        <div class="profile-header">
            <div class="avatar-container">
                <div class="avatar">OO</div>
                <span class="status-badge">TIER 3</span>
            </div>
            <h2>Oluwaseun O. Bello</h2>
            <p>Acc No: 0034567891</p>
        </div>

        <!-- Body -->
        <div class="profile-body">
            <div class="section-title">Personal Information</div>
            
            <div class="info-group">
                <span class="info-label">Email Address</span>
                <span class="info-value">rolviccontractors@gmail.com</span>
            </div>

            <div class="info-group">
                <span class="info-label">Phone Number</span>
                <span class="info-value">+234 803 123 4567</span>
            </div>

            <div class="info-group">
                <span class="info-label">BVN</span>
                <span class="info-value">222******89</span>
            </div>

            <div class="section-title">Account Details</div>

            <div class="info-group">
                <span class="info-label">Account Type</span>
                <span class="info-value">Blue高端 Savings</span>
            </div>

            <div class="info-group">
                <span class="info-label">Branch</span>
                <span class="info-value">Walter Carrington, Lagos</span>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="profile-footer">
            <button class="btn btn-secondary">Edit Profile</button>
            <a href="index.html" class="btn btn-primary">Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
