<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanbic IBTC - Bill Payment</title>
    <style>
        :root {
            --primary-blue: #0033aa;
            --light-blue: #e6f0fa;
            --dark-text: #333333;
            --gray-border: #cccccc;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            background-color: var(--light-blue);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-blue);
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .tab-btn.active {
            background-color: var(--white);
            border-bottom: 3px solid var(--primary-blue);
        }

        .form-container {
            padding: 30px;
        }

        .payment-form {
            display: none;
        }

        .payment-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-text);
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-border);
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary-blue);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: #002277;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Stanbic IBTC Payments</h1>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('electricity')">Electricity</button>
        <button class="tab-btn" onclick="switchTab('tv')">TV Subscription</button>
    </div>

    <div class="form-container">
        <!-- Electricity Form -->
        <form id="electricity" class="payment-form active" onsubmit="event.preventDefault(); alert('Electricity payment processing...');">
            <div class="form-group">
                <label for="disco">Select DisCo (Provider)</label>
                <select id="disco" required>
                    <option value="">-- Choose Provider --</option>
                    <option value="ekedc">EKEDC (Eko)</option>
                    <option value="ikedc">IKEDC (Ikeja)</option>
                    <option value="aedc">AEDC (Abuja)</option>
                    <option value="ibedc">IBEDC (Ibadan)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="meter-type">Meter Type</label>
                <select id="meter-type" required>
                    <option value="prepaid">Prepaid</option>
                    <option value="postpaid">Postpaid</option>
                </select>
            </div>

            <div class="form-group">
                <label for="meter-number">Meter / Account Number</label>
                <input type="number" id="meter-number" placeholder="Enter meter number" required>
            </div>

            <div class="form-group">
                <label for="elect-amount">Amount (NGN)</label>
                <input type="number" id="elect-amount" placeholder="0.00" min="100" required>
            </div>

            <button type="submit" class="btn-submit">Pay Bill</button>
        </form>

        <!-- TV Form -->
        <form id="tv" class="payment-form" onsubmit="event.preventDefault(); alert('TV payment processing...');">
            <div class="form-group">
                <label for="tv-provider">Select Provider</label>
                <select id="tv-provider" required>
                    <option value="">-- Choose Provider --</option>
                    <option value="dstv">DSTV</option>
                    <option value="gotv">GOtv</option>
                    <option value="startimes">StarTimes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="package">Select Package</label>
                <select id="package" required>
                    <option value="">-- Choose Package --</option>
                    <option value="premium">Premium</option>
                    <option value="compact">Compact</option>
                    <option value="max">Max / Plus</option>
                </select>
            </div>

            <div class="form-group">
                <label for="smartcard">Smartcard / UIC Number</label>
                <input type="number" id="smartcard" placeholder="Enter smartcard number" required>
            </div>

            <div class="form-group">
                <label for="tv-amount">Amount (NGN)</label>
                <input type="number" id="tv-amount" placeholder="0.00" min="100" required>
            </div>

            <button type="submit" class="btn-submit">Pay Bill</button>
        </form>
    </div>
</div>

<script>
    function switchTab(tabId) {
        // Remove active class from all forms and tab buttons
        document.querySelectorAll('.payment-form').forEach(form => form.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        // Add active class to selected form and targeted tab button
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
