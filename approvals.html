<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approvals | Internet Banking</title>
  <style>
    :root { --primary:#0056b3; --header-blue:#0066cc; --bg:#f4f6f9; --muted:#6b7280; --border:#e5e7eb; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); min-height:100vh; padding-bottom:80px; }
    .app-header { background:linear-gradient(180deg,var(--header-blue),#0052a3); color:#fff; padding:16px 16px 20px; }
    .select-bar { background:#fff; margin:14px 16px 0; border-radius:8px; padding:10px 14px; display:flex; justify-content:space-between; font-size:14px; font-weight:500; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    main { padding:16px; }
    .card { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); padding:14px; }
    .pill, .search { width:100%; border:1px solid var(--border); border-radius:8px; padding:11px 12px; font-size:14px; }
    .refresh { border:1.5px solid var(--primary); color:var(--primary); background:#fff; border-radius:8px; padding:8px 14px; font-weight:700; }
    .table-head { margin-top:14px; background:var(--primary); color:#fff; border-radius:6px; display:grid; grid-template-columns:1fr 90px; padding:10px 12px; font-weight:700; font-size:13px; }
    .empty { text-align:center; color:var(--muted); padding:28px 8px 10px; }
    .pager { display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:13px; }
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:64px; background:var(--header-blue); display:flex; align-items:center; justify-content:space-around; }
    .nav-item { color:#fff; text-decoration:none; font-size:10px; opacity:.75; }
    .nav-item.active { opacity:1; font-weight:700; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1></h1>
    <p>Welcome back!</p>
  </header>

  <div class="select-bar">Pending <span>▼ Select A Module</span></div>

  <main>
    <div class="card">
      <button class="pill" type="button">All ▼ Select Transaction</button>
      <input class="search" placeholder="Type to search" style="margin:10px 0;">
      <button class="refresh" type="button">↻ REFRESH</button>
      <div class="table-head"><span>Request Details</span><span>Action</span></div>
      <p class="empty">0 of 0</p>
      <div class="pager">
        <span>Items per page:
          <select><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
        </span>
        <span>&lt; &gt;</span>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="airtime.html">Home</a>
    <a class="nav-item" href="airtime.html">Airtime</a>
    <a class="nav-item" href="transfer.html">Transfer</a>
    <a class="nav-item" href="loan.html">Loans</a>
    <a class="nav-item active" href="approvals.html">Approvals</a>
  </nav>
</body>
</html>
