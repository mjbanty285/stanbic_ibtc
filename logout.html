<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | Stanbic IBTC</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333333;
        }

        /* Card Container */
        .logout-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border-top: 6px solid #0033aa; /* Stanbic Blue */
        }

        /* Logo Placeholder */
        .brand-logo {
            font-size: 24px;
            font-weight: bold;
            color: #0033aa;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .brand-logo .icon {
            width: 30px;
            height: 30px;
            background-color: #0033aa;
            border-radius: 4px;
            display: inline-block;
        }

        /* Icon Animation */
        .success-icon {
            width: 60px;
            height: 60px;
            background-color: #e6f0ff;
            color: #0033aa;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 30px;
            font-weight: bold;
        }

        /* Typography */
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #666666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Action Button */
        .btn-login {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #0033aa;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            font-size: 15px;
        }

        .btn-login:hover {
            background-color: #002277;
        }

        /* Footer Note */
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #999999;
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
        }

        .footer-note a {
            color: #0033aa;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="logout-container">
        <!-- Brand Header -->
        <div class="brand-logo">
            <div class="icon"></div>
            Stanbic IBTC
        </div>

        <!-- Success Checkmark Graphic -->
        <div class="success-icon">✓</div>

        <!-- Logout Message -->
        <h1>Securely Logged Out</h1>
        <p>Thank you for banking with us online. Your session has been safely closed to protect your financial data.</p>

        <!-- Redirect Button -->
        <a href="login.html" class="btn-login">Log Back In</a>

        <!-- Security Reminder Footer -->
        <div class="footer-note">
            For security, close this browser window. <br>
            Need help? Contact <a href="#">Customer Care</a>.
        </div>
    </div>

</body>
</html>
